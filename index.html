<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#17304E">
<title>HerCall | Dados e apoio</title>
<style>
:root {
  --navy:#17304e; --magenta:#a4106c; --page:#fbfafb; --white:#fff;
  --help:#fcf0f7; --lavender:#f5e8f1; --pink:#f1d6e6;
  --line:#e7dce4; --muted:#556176;
}
* { box-sizing:border-box }
body { margin:0; background:var(--page); color:var(--navy); font:1rem/1.45 system-ui,sans-serif }
h1,h2,h3,p { margin:0 }
[hidden] { display:none!important }
a { color:var(--magenta); text-underline-offset:.18em }
:focus-visible { outline:3px solid var(--magenta); outline-offset:3px }
.sr-only,.skip:not(:focus) { position:absolute; width:1px; height:1px; padding:0; clip-path:inset(50%); overflow:hidden; white-space:nowrap }
.skip { display:block; padding:.5rem 1rem }
.page { max-width:74rem; margin:1rem auto; width:calc(100% - 2rem); border:1px solid var(--line); border-radius:1rem; padding:0 1rem 1rem }
header { display:flex; align-items:center; justify-content:space-between; gap:.75rem; padding:.7rem .15rem; border-bottom:1px solid var(--line) }
.brand { display:flex; align-items:center; gap:.65rem; font-size:.8rem; font-weight:800; text-decoration:none; color:var(--navy) }
.brand img { display:block; width:2.25rem; height:2.25rem; border-radius:50% }
.accent { color:var(--magenta) }
.languages { display:flex; gap:.3rem }
.languages button { display:grid; place-items:center; width:2.75rem; height:2.75rem; padding:.35rem; border:1px solid transparent; border-radius:50%; background:none; cursor:pointer }
.languages button[aria-pressed="true"] { border-color:var(--magenta) }
.flag { width:100%; aspect-ratio:1; border-radius:50%; display:block; overflow:hidden }
.wordmark { margin:1rem .45rem .8rem; font-size:clamp(2rem,5vw,3rem); letter-spacing:-.04em }
.wordmark img { display:block; width:calc(clamp(9rem,18vw,11.25rem) * var(--wordmark-scale, 1)); max-width:100%; height:auto }
html[lang="pt-BR"] .wordmark img { --wordmark-scale:1.17 }
html[lang="es"] .wordmark img { --wordmark-scale:1.22 }
.layout { display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); grid-template-areas:"dash info"; align-items:start; gap:1rem }
.dashboard { grid-area:dash; padding:.85rem; border-radius:.85rem; background:var(--lavender) }
.info { grid-area:info; display:grid; gap:1.15rem }
.intro { padding:0 .3rem; margin-bottom:.1rem }
.intro h2 { font-size:clamp(1.25rem,2.35vw,1.65rem); color:var(--magenta); line-height:1.2; margin-bottom:.5rem }
.intro p { font-size:.92rem }
.help,.rights { padding:.85rem; border-radius:.85rem; background:var(--help) }
.help h2,.rights h2,.dashboard h2 { font-size:1.08rem; margin-bottom:.35rem }
.select-shell { position:relative; margin-top:.35rem }
.select-shell::after,.rights summary::after { content:""; display:inline-block; width:.45rem; height:.45rem; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:rotate(45deg) }
.select-shell::after { position:absolute; right:.95rem; top:calc(50% - .35rem); pointer-events:none }
label { font-size:.9rem }
select { appearance:none; background:var(--white); border:1px solid #dda8c9; color:inherit; width:100%; min-height:2.8rem; padding:.45rem 2rem .45rem .7rem; border-radius:.55rem; font:inherit; font-weight:650 }
.question { margin:1rem .12rem .55rem; font-size:clamp(1.3rem,2.55vw,1.8rem); line-height:1.18 }
.contacts { display:grid; gap:.48rem }
.contact { display:grid; place-items:center; gap:.25rem; min-height:3.85rem; border-radius:.6rem; background:var(--magenta); color:var(--white); text-align:center; padding:.6rem }
.contact.emergency { background:var(--navy) }
.contact-title { font-weight:750 }
.contact-links { display:flex; flex-wrap:wrap; justify-content:center; gap:.3rem .65rem }
.contact-links a { color:inherit; padding:.35rem .6rem }
.contact-links a[href^="tel:"] { font-size:1.1rem; font-weight:750; text-decoration:underline }
.contact-links a:focus-visible { outline-color:currentColor }
.contact.contact-resource { background:var(--white); color:var(--navy); border:1px solid var(--line) }
.contact-resource .contact-links a { color:var(--magenta) }
.status:not(:empty) { margin-top:.55rem }
.rights p { font-size:.88rem; margin:.3rem 0 }
.rights summary { cursor:pointer; width:fit-content; list-style:none; color:var(--magenta); font-weight:650; padding:.3rem 0 }
.rights summary::-webkit-details-marker { display:none }
.rights summary::after { margin:0 0 .2rem .6rem }
.rights details[open] summary::after { transform:rotate(225deg); margin-bottom:0 }
.rights details[open] .closed-label,.rights details:not([open]) .open-label { display:none }
.reference { border-top:1px solid var(--line); padding:.55rem 0 .3rem }
.reference h3 { font-size:.92rem }
.reference a { display:inline-block; font-size:.9rem; font-weight:650; padding:.2rem 0 }
.contribute { justify-self:start; color:var(--muted); border:1px solid var(--line); background:var(--white); border-radius:.55rem; padding:.55rem .75rem; font:inherit }
.report-external { display:inline-block; margin-top:.5rem; font-size:.875rem }
.dash-note { margin-top:.45rem; font-size:.86rem }
.report-frame { width:100%; min-height:32rem; border:0; background:var(--white); border-radius:.6rem }
footer { width:fit-content; margin:.6rem auto 1.25rem; padding:0 .75rem; text-align:center; color:var(--muted); font-size:.78rem }
footer button { font:inherit; color:inherit }
@media(max-width:45rem) {
  .page { width:calc(100% - 1rem); margin:.5rem auto; padding:0 .7rem .7rem }
  .layout { grid-template-columns:minmax(0,1fr); grid-template-areas:"info" "dash" }
  .info { gap:1rem }
  .wordmark { margin:.85rem .2rem .7rem }
  .report-frame { min-height:23rem }
}
</style>
</head>
<body>
<a class="skip" href="#apoio" data-text="skip"></a>
<div class="page" id="inicio">
  <header>
    <a class="brand" href="#inicio">
      <img src="./databv_assets/logo.png" width="36" height="36" alt="">
      <span>DATABV <span class="accent">HER CALL</span></span>
    </a>
    <nav class="languages" data-label="languages">
      <button type="button" data-language="en" aria-label="English" lang="en" aria-pressed="false">
        <svg class="flag" viewBox="0 0 39 39" aria-hidden="true">
          <rect width="39" height="39" fill="#fff"/>
          <path stroke="#b1283d" stroke-width="3" d="M0 1.5H39M0 7.5H39M0 13.5H39M0 19.5H39M0 25.5H39M0 31.5H39M0 37.5H39"/>
          <path fill="#294175" d="M0 0h20v21H0z"/>
          <path stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-dasharray=".5 3.3" d="M1.5 4h17M1.5 8h17M1.5 12h17M1.5 16h17M1.5 19h17"/>
        </svg>
      </button>
      <button type="button" data-language="es" aria-label="Español" lang="es" aria-pressed="false">
        <svg class="flag" viewBox="0 0 39 39" aria-hidden="true">
          <path fill="#b90f28" d="M0 0h39v39H0z"/>
          <path fill="#ffc63f" d="M0 10h39v19H0z"/>
          <path fill="#a82943" d="M10 15h7v9l-3.5 2-3.5-2z"/>
          <path fill="#f8e6b3" d="M12 17h3v6h-3z"/>
        </svg>
      </button>
      <button type="button" data-language="pt-BR" aria-label="Português" lang="pt-BR" aria-pressed="true">
        <svg class="flag" viewBox="0 0 39 39" aria-hidden="true">
          <path fill="#168342" d="M0 0h39v39H0z"/>
          <path fill="#ffdf55" d="m3 19.5 16.5-10.5L36 19.5 19.5 30z"/>
          <circle cx="19.5" cy="19.5" r="7" fill="#22418a"/>
          <path d="M13.3 17.7q7-.7 12.5 5.4" fill="none" stroke="#fff" stroke-width="1.6"/>
        </svg>
      </button>
    </nav>
  </header>

  <h1 class="wordmark" id="portal-wordmark">HerCall</h1>
  <main class="layout">
    <div class="info">
      <section class="intro" aria-labelledby="intro-title">
        <h2 id="intro-title" data-text="introTitle"></h2>
        <p data-text="intro"></p>
      </section>

      <section class="help" id="apoio" aria-labelledby="help-title">
        <h2 id="help-title" data-text="help"></h2>
        <label for="country" data-text="country"></label>
        <div class="select-shell"><select id="country" disabled></select></div>
        <div id="results" aria-busy="true">
          <h3 class="question" id="question" hidden>
            <span id="question-start"></span><span class="accent" id="country-name"></span><span>?</span>
          </h3>
          <p class="sr-only" id="status" role="status"></p>
          <div id="contacts" class="contacts"></div>
        </div>
        <noscript><p>Ative o JavaScript para consultar os canais de ajuda.</p></noscript>
      </section>

      <section class="rights" id="direitos" aria-labelledby="rights-title" hidden>
        <h2 id="rights-title" data-text="rights"></h2>
        <p data-text="rightsIntro"></p>
        <details id="rights-details">
          <summary>
            <span class="closed-label" data-text="show"></span>
            <span class="open-label" data-text="hide"></span>
          </summary>
          <div id="references"></div>
        </details>
      </section>

      <button type="button" class="contribute" disabled data-text="contribute"></button>
    </div>

    <section class="dashboard" aria-labelledby="dash-title">
      <h2 id="dash-title" data-text="introTitle"></h2>
      <div id="report">
        <p class="dash-note" data-text="preview"></p>
      </div>
    </section>
  </main>
</div>

<footer>
  <p>DataBV Product © 2026</p>
  <button id="analytics-preference" type="button" hidden></button>
</footer>

<script>
const config = {
  countriesUrl: "./data/hercall.json",
  logos: {
    "pt-BR": { src: "./assets/hercall_logo_ptbr.png", alt: "Chamada delas" },
    en: { src: "./assets/hercall_logo.png", alt: "HerCall" },
    es: { src: "./assets/hercall_logo_esp.png", alt: "Llamada de ellas" }
  },
  defaultPowerBiEmbedUrl: "https://app.powerbi.com/view?r=eyJrIjoiZWQ5MTkxNTktZjExNC00ODA2LTgzYmMtMDQ5MTNhMTUzNmM5IiwidCI6IjU3NWY4MjQ5LWM0ZmUtNGVhNy04NzQ5LTI0MmU3OGRlZWYwZCJ9",
  powerBiEmbedUrls: { "pt-BR": "", en: "", es: "" },
  ga4MeasurementId: "",
  analyticsHostname: "databv.services"
};

const translations = {
  "pt-BR": {
    title: "Dados e apoio", skip: "Ir para os canais de ajuda", languages: "Idioma",
    introTitle: "Violência contra a mulher",
    intro: "A violência contra a mulher pode assumir diferentes formas e afetar a segurança, a saúde e a autonomia. Explore os dados para entender o problema.",
    help: "Encontre ajuda", country: "Em que país você está?", question: "Seu país é ",
    call: "Ligue", emergency: "Emergência", rights: "Direitos e proteção",
    rightsIntro: "Legislação e canais oficiais do país selecionado.",
    show: "Consultar informações", hide: "Ocultar informações", law: "Ver ficha na ONU Mulheres",
    network: "Consultar a rede de atendimento", preview: "O painel ainda não está disponível neste idioma.",
    report: "Painel HerCall no Power BI", openReport: "Abrir no Power BI", loading: "Carregando países…",
    unavailable: "Não foi possível carregar os contatos. Recarregue a página para tentar novamente.",
    emptyContacts: "Canais de apoio ainda não cadastrados.", emptyRights: "Informações oficiais ainda não cadastradas.",
    contribute: "Contribua com mais informações", site: "Abrir site", source: "Ver referência",
    analyticsOn: "Permitir estatísticas de uso", analyticsOff: "Desativar estatísticas de uso",
    updated: "Canais de apoio atualizados para "
  },
  en: {
    title: "Data and support", skip: "Skip to support", languages: "Language",
    introTitle: "Violence against women",
    intro: "Violence against women can take many forms and affect their safety, health, and autonomy. Explore the data to understand the issue.",
    help: "Find support", country: "Which country are you in?", question: "Are you in ",
    call: "Call", emergency: "Emergency", rights: "Rights and protection",
    rightsIntro: "Laws and official resources for the selected country.",
    show: "View information", hide: "Hide information", law: "View UN Women record",
    network: "View the support network", preview: "The dashboard is not yet available in this language.",
    report: "HerCall Power BI dashboard", openReport: "Open in Power BI", loading: "Loading countries…",
    unavailable: "We couldn't load the contacts. Reload the page to try again.",
    emptyContacts: "Support contacts have not been added yet.", emptyRights: "Official information has not been added yet.",
    contribute: "Contribute more information", site: "Open website", source: "View reference",
    analyticsOn: "Allow usage analytics", analyticsOff: "Disable usage analytics",
    updated: "Support contacts updated for "
  },
  es: {
    title: "Datos y apoyo", skip: "Ir a los canales de ayuda", languages: "Idioma",
    introTitle: "Violencia contra las mujeres",
    intro: "La violencia contra las mujeres puede adoptar distintas formas y afectar su seguridad, su salud y su autonomía. Explora los datos para entender el problema.",
    help: "Encuentra ayuda", country: "¿En qué país estás?", question: "¿Estás en ",
    call: "Llama al", emergency: "Emergencias", rights: "Derechos y protección",
    rightsIntro: "Legislación y recursos oficiales del país seleccionado.",
    show: "Consultar información", hide: "Ocultar información", law: "Ver ficha en ONU Mujeres",
    network: "Consultar la red de atención", preview: "El panel aún no está disponible en este idioma.",
    report: "Panel de HerCall en Power BI", openReport: "Abrir en Power BI", loading: "Cargando países…",
    unavailable: "No se pudieron cargar los contactos. Vuelve a cargar la página para intentarlo de nuevo.",
    emptyContacts: "Todavía no hay contactos de apoyo registrados.", emptyRights: "Todavía no hay información oficial registrada.",
    contribute: "Aporta más información", site: "Abrir sitio web", source: "Ver referencia",
    analyticsOn: "Permitir estadísticas de uso", analyticsOff: "Desactivar estadísticas de uso",
    updated: "Contactos de apoyo actualizados para "
  }
};

const select = document.querySelector("#country");
const question = document.querySelector("#question");
const contacts = document.querySelector("#contacts");
const rights = document.querySelector("#direitos");
const details = document.querySelector("#rights-details");
const references = document.querySelector("#references");
const status = document.querySelector("#status");
const report = document.querySelector("#report");
const reportPreview = [...report.childNodes];
const languageButtons = document.querySelectorAll("[data-language]");
const textNodes = [...document.querySelectorAll("[data-text]")];

let language = "pt-BR";
let countries = [];
let failed = false;
let currentReport = null;

function localized(value) {
  return typeof value === "string" ? value : value?.[language] ?? value?.["pt-BR"] ?? "";
}

function element(tag, className, content) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (content) node.textContent = content;
  return node;
}

function parseUrl(value) {
  if (!value) return null;
  try {
    return new URL(value);
  } catch {
    return null;
  }
}

function externalLink(value, label, className = "") {
  const url = parseUrl(value);
  if (url?.protocol !== "https:") return null;
  const link = element("a", className, label);
  link.href = url.href;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  return link;
}

function contactButton(contact, copy, excludedNumbers = new Set()) {
  const card = element("article", contact.emergency ? "contact emergency" : "contact");
  const actions = element("div", "contact-links");
  const phones = String(contact.phone ?? "").trim()
    .split(/\s*(?:\bor\b|\bou\b|\bo\b|[;\n])\s*/i)
    .filter(Boolean);
  let canCall = false;

  for (const label of phones) {
    const number = label.replace(/^.*\((\+?\d[\d .-]+)\)\s*$/, "$1");
    const digits = number.replace(/\D/g, "");
    const localAreaSlash = /^\d{3,5}\/\d[\d .-]+$/.test(number);
    const canDial = (/^\+?\d[\d ().–-]*$/.test(number) || localAreaSlash)
      && !/^\+.*\(0\)/.test(number)
      && digits.length >= 3 && digits.length <= 15;

    if (!canDial) {
      actions.append(element("span", "", label));
      continue;
    }

    const dial = (number.startsWith("+") ? "+" : "") + digits;
    if (excludedNumbers.has(dial)) continue;

    const action = contact.emergency ? copy.emergency : copy.call;
    const link = element("a", "", action + " " + label);
    link.href = "tel:" + dial;
    actions.append(link);
    canCall = true;
  }

  const site = externalLink(contact.url, contact.official ? copy.source : copy.site);
  if (site) actions.append(site);
  if (!actions.childElementCount) return null;
  if (!canCall) card.classList.add("contact-resource");

  card.append(actions, element("span", "contact-title", contact.org_name || contact.category));
  return card;
}

function resourceRow(resource, copy) {
  const row = element("div", "reference");
  row.append(element("h3", "", resource.title));

  if (resource.start_year != null) {
    const years = [resource.start_year, resource.end_year].filter((year, index, values) =>
      year != null && values.indexOf(year) === index);
    row.append(element("p", "", years.join("–")));
  }

  const record = externalLink(resource.record_url, copy.law);
  const reference = externalLink(resource.reference_url, copy.source);

  if (record) row.append(record);
  if (reference && reference.href !== record?.href) {
    if (record) row.append(document.createElement("br"));
    row.append(reference);
  }

  return row;
}

function renderCountry(announce = false) {
  const copy = translations[language];
  const country = countries.find(item => item.code === select.value);

  question.hidden = !country;
  rights.hidden = !country;
  status.className = failed ? "status" : "sr-only";
  status.textContent = failed ? copy.unavailable : "";
  if (!country) return;

  const name = localized(country.name);
  document.querySelector("#question-start").textContent = copy.question;
  document.querySelector("#country-name").textContent = name;

  const officialSource = "https://www.gov.br/mulheres/pt-br/assuntos/ligue180";
  const officialContacts = country.code === "BR" ? [
    { org_name: "Polícia Militar", phone: "190", emergency: true, official: true, url: officialSource },
    { org_name: "Central de Atendimento à Mulher", phone: "180", official: true, url: officialSource }
  ] : [];
  const officialNumbers = new Set(officialContacts.map(contact => contact.phone));
  const buttons = [
    ...officialContacts.map(contact => contactButton(contact, copy)),
    ...country.contacts.map(contact => contactButton(contact, copy, officialNumbers))
  ].filter(Boolean);

  const resources = country.laws.map(resource => resourceRow(resource, copy));
  const directory = externalLink(country.help_url, copy.network + " · NO MORE");
  contacts.replaceChildren(...(buttons.length ? buttons : [element("p", "status", copy.emptyContacts)]));
  if (directory) contacts.append(directory);

  references.replaceChildren(...(resources.length ? resources : [element("p", "", copy.emptyRights)]));
  if (announce) status.textContent = copy.updated + name + ".";
}

let renderedLogoLanguage;

function renderLogo() {
  if (language === renderedLogoLanguage) return;
  renderedLogoLanguage = language;

  const heading = document.querySelector("#portal-wordmark");
  const logo = config.logos[language];
  const fallback = element("span", "", logo.alt);
  const image = element("img", "");
  image.alt = logo.alt;
  image.hidden = true;
  image.addEventListener("load", () => {
    fallback.hidden = true;
    image.hidden = false;
  }, { once: true });
  heading.replaceChildren(fallback, image);
  image.src = logo.src;
}

function renderReport(copy) {
  const embed = parseUrl(config.powerBiEmbedUrls[language] || config.defaultPowerBiEmbedUrl);
  const url = embed?.origin === "https://app.powerbi.com" ? embed.href : null;

  if (url === currentReport) {
    if (url) {
      report.querySelector("iframe").title = copy.report;
      report.querySelector(".report-external").textContent = copy.openReport;
    }
    return;
  }

  currentReport = url;
  if (!url) {
    report.replaceChildren(...reportPreview);
    return;
  }

  const frame = element("iframe", "report-frame");
  frame.title = copy.report;
  frame.src = url;
  frame.allowFullscreen = true;
  frame.loading = "lazy";

  const link = element("a", "report-external", copy.openReport);
  link.href = url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  report.replaceChildren(frame, link);
}

function renderLanguage() {
  const copy = translations[language];
  const selected = select.value;
  document.documentElement.lang = language;
  document.title = "HerCall | " + copy.title;

  textNodes.forEach(node => {
    node.textContent = copy[node.dataset.text];
  });
  document.querySelectorAll("[data-label]").forEach(node => {
    node.setAttribute("aria-label", copy[node.dataset.label]);
  });
  languageButtons.forEach(button => {
    button.setAttribute("aria-pressed", String(button.dataset.language === language));
  });

  if (countries.length) {
    const collator = new Intl.Collator(language);
    const sorted = [...countries].sort((a, b) => collator.compare(localized(a.name), localized(b.name)));
    select.replaceChildren(...sorted.map(country => new Option(localized(country.name), country.code)));
    select.value = countries.find(country => country.code === selected)?.code
      ?? countries.find(country => country.code === "BR")?.code ?? countries[0].code;
  } else {
    select.replaceChildren(new Option(failed ? "—" : copy.loading, ""));
  }

  renderCountry();
  renderLogo();
  renderReport(copy);
  renderAnalyticsPreference(copy);
}

async function readCountries() {
  const response = await fetch(config.countriesUrl, { cache: "no-cache" });
  if (!response.ok) throw new Error("Base indisponível");
  return response.json();
}

async function initialize() {
  renderLanguage();
  try {
    const data = await readCountries();
    if (!Array.isArray(data) || !data.length) throw new Error("Base vazia");
    countries = data;
    select.disabled = false;
  } catch {
    failed = true;
  } finally {
    document.querySelector("#results").setAttribute("aria-busy", "false");
    renderLanguage();
  }
}

const analyticsPreference = document.querySelector("#analytics-preference");
const analyticsId = config.ga4MeasurementId;
const analyticsAvailable = /^G-[A-Z0-9]+$/.test(analyticsId)
  && location.hostname === config.analyticsHostname;
let analyticsAllowed = false;
let analyticsStarted = false;

function renderAnalyticsPreference(copy) {
  analyticsPreference.hidden = !analyticsAvailable;
  analyticsPreference.textContent = analyticsAllowed ? copy.analyticsOff : copy.analyticsOn;
}

function startAnalytics() {
  if (!analyticsAvailable || !analyticsAllowed || analyticsStarted) return;
  analyticsStarted = true;

  const script = document.createElement("script");
  script.async = true;
  script.src = "https://www.googletagmanager.com/gtag/js?id=" + analyticsId;
  window.dataLayer = window.dataLayer || [];

  function gtag() {
    window.dataLayer.push(arguments);
  }

  gtag("js", new Date());
  gtag("config", analyticsId, {
    send_page_view: false,
    allow_google_signals: false,
    allow_ad_personalization_signals: false
  });
  gtag("event", "page_view", {
    page_location: location.origin + location.pathname,
    page_referrer: "",
    page_title: "HerCall"
  });
  document.head.append(script);
}

if (analyticsAvailable) {
  try {
    analyticsAllowed = localStorage.getItem("hercall-analytics") === "yes";
  } catch {}

  window["ga-disable-" + analyticsId] = !analyticsAllowed;
  startAnalytics();

  analyticsPreference.addEventListener("click", () => {
    analyticsAllowed = !analyticsAllowed;
    window["ga-disable-" + analyticsId] = !analyticsAllowed;
    try {
      localStorage.setItem("hercall-analytics", analyticsAllowed ? "yes" : "no");
    } catch {}
    startAnalytics();
    renderAnalyticsPreference(translations[language]);
  });
}

languageButtons.forEach(button => button.addEventListener("click", () => {
  language = button.dataset.language;
  renderLanguage();
}));

select.addEventListener("change", () => {
  details.open = false;
  renderCountry(true);
});

initialize();
</script>
</body>
</html>
